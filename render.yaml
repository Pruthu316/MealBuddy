databases:
  - name: mealbuddy-db
    databaseName: mealbuddy
    user: mealbuddy_user
    plan: free

services:
  - type: web
    name: mealbuddy
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn Mealmate.wsgi:application"
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mealbuddy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
