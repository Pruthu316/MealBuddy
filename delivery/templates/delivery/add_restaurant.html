<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Restaurant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 6px rgba(0, 123, 255, 0.2);
        }

        input::placeholder {
            color: #aaa;
        }

        .rating-info {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .restaurant-icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="restaurant-icon">
            🍽️
        </div>

        <h1>Add Restaurant</h1>

        <form action="{% url 'add_restaurant' %}" method="post">

            {% csrf_token %}

            <div class="form-group">
                <label for="name">Restaurant Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter restaurant name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="picture">Picture URL</label>

                <input
                    type="url"
                    id="picture"
                    name="picture"
                    placeholder="https://example.com/restaurant.jpg"
                    required
                >
            </div>


            <div class="form-group">
                <label for="cuisine">Cuisine</label>

                <input
                    type="text"
                    id="cuisine"
                    name="cuisine"
                    placeholder="e.g. Indian, Chinese, Italian"
                    required
                >
            </div>


            <div class="form-group">
                <label for="rating">Rating</label>

                <input
                    type="number"
                    id="rating"
                    name="rating"
                    min="0"
                    max="5"
                    step="0.5"
                    placeholder="Enter rating (0 - 5)"
                    required
                >

                <div class="rating-info">
                    ⭐ Rating should be between 0 and 5
                </div>
            </div>


            <button type="submit">
                ➕ Add Restaurant
            </button>

        </form>

    </div>

</body>
</html>
