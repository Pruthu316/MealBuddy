<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        thead {
            background: #222;
            color: white;
        }

        th {
            padding: 16px;
            text-align: center;
            font-size: 15px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
            color: #444;
        }

        tbody tr:hover {
            background: #f8f9fc;
        }

        .restaurant-img {
            width: 100px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .rating {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .operation {
            display: inline-block;
            margin: 4px;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 13px;
            transition: 0.3s;
        }

        .operation:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        .delete {
            background: #dc3545;
        }

        .delete:hover {
            background: #a71d2a;
        }

        .menu {
            background: #28a745;
        }

        .menu:hover {
            background: #1e7e34;
        }

        .map {
            display: inline-block;
            padding: 8px 14px;
            background: #ff5722;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
        }

        .map:hover {
            background: #e64a19;
        }

        @media (max-width: 800px) {
            body {
                padding: 15px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

            .restaurant-img {
                width: 70px;
                height: 50px;
            }

            .operation {
                display: block;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍴 Restaurant List</h1>

    <table>
        <thead>
            <tr>
                <th>Restaurant Name</th>
                <th>Picture</th>
                <th>Cuisine</th>
                <th>Rating</th>
                <th>Operations</th>
                <th>Location</th>
            </tr>
        </thead>

        <tbody>

            {% for r in restaurantList %}

            <tr>

                <td>
                    <strong>{{ r.name }}</strong>
                </td>

                <td>
                    <img
                        src="{{ r.picture }}"
                        alt="{{ r.name }}"
                        class="restaurant-img"
                    >
                </td>

                <td>
                    {{ r.cuisine }}
                </td>

                <td>
                    <span class="rating">
                        ⭐ {{ r.rating }}
                    </span>
                </td>

                <td>

                    <a
                        href="{% url 'open_update_restaurant' r.id %}"
                        class="operation"
                    >
                        ✏️ Update
                    </a>

                    <a
                        href="{% url 'delete_restaurant' r.id %}"
                        class="operation delete"
                    >
                        🗑️ Delete
                    </a>

                    <a
                        href="{% url 'open_update_menu' r.id %}"
                        class="operation menu"
                    >
                        🍽️ Update Menu
                    </a>

                </td>

                <td>

                    <a
                        href="https://www.google.com/maps/search/?api=1&query={{ r.name|urlencode }}"
                        target="_blank"
                        class="map"
                    >
                        📍 View Map
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>
    </table>

</div>

</body>
</html>
