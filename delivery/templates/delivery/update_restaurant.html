<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Restaurant - Meal Buddy</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            padding: 20px;
        }

        .update-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 6px rgba(0, 123, 255, 0.2);
        }

        .update-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .update-button:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #007bff;
        }

        @media (max-width: 600px) {

            .update-container {
                padding: 30px 25px;
            }

        }

    </style>

</head>

<body>

    <div class="update-container">

        <div class="logo">
            🍽️
        </div>

        <h1>Update Restaurant</h1>

        <p class="subtitle">
            Modify the restaurant information below.
        </p>

        <form action="{% url 'open_update_restaurant' restaurant.id %}" method="post">

            {% csrf_token %}

            <div class="form-group">

                <label for="name">
                    Restaurant Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ restaurant.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="picture">
                    Picture URL
                </label>

                <input
                    type="text"
                    id="picture"
                    name="picture"
                    value="{{ restaurant.picture }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="cuisine">
                    Cuisine
                </label>

                <input
                    type="text"
                    id="cuisine"
                    name="cuisine"
                    value="{{ restaurant.cuisine }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="rating">
                    Rating
                </label>

                <input
                    type="number"
                    id="rating"
                    name="rating"
                    value="{{ restaurant.rating }}"
                    min="0"
                    max="5"
                    step="0.5"
                    required
                >

            </div>


            <button
                type="submit"
                class="update-button"
            >
                ✏️ Update Restaurant
            </button>

        </form>


        <a
            href="{% url 'open_show_restaurant' %}"
            class="back-link"
        >
            ← Back to Restaurants
        </a>

    </div>

</body>

</html>
